[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pid"
version = "0.1.0"
description = "Implementation of the reference PID controller by Sundström et al. (2024) in Python"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Bill Tubbs"}
]
dependencies = [
    "numpy>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["python_pid*"]
